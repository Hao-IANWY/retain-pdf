name: Release Docker Images
run-name: Release Docker Images · ${{ github.ref_name }}

on:
  pull_request:
    paths:
      - '.github/workflows/release-docker.yml'
      - '.github/actions/prepare-backend-source/**'
      - '.github/scripts/resolve_backend_source.py'
      - '.github/scripts/resolve_release_version.py'
      - '.dockerignore'
      - 'backend-package.json'
      - 'package.json'
      - 'package-lock.json'
      - 'frontend/web/scripts/build-workspace-packages.mjs'
      - 'frontend/desktop/package.json'
      - 'frontend/web/**'
      - 'frontend/packages/api/**'
      - 'frontend/packages/domain/**'
      - 'frontend/packages/reader/**'
      - 'contracts/**'
      - 'frontend/packages/ui/**'
      - 'ops/deployment/docker/Dockerfile.web'
      - 'ops/deployment/docker/entrypoint-web.sh'
      - 'ops/deployment/docker/nginx-mjs.types.conf'
      - 'ops/deployment/docker/nginx.conf.template'
      - 'backend/**'
      - 'database/**'
      - 'resources/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'ops/deployment/docker/backend/**'
  workflow_dispatch:
    inputs:
      version:
        description: '镜像版本号，例如 v4.2.0'
        required: true
        default: 'dev'
      push:
        description: '是否推送到 Docker Hub？选 false 则只构建不推送'
        type: boolean
        required: false
        default: false
      platforms:
        description: '目标平台（逗号分隔）'
        required: false
        default: 'linux/amd64,linux/arm64'
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*'
      # Desktop hotfix/prerelease tags are intentionally excluded. They used to
      # start a second copy of the full quality gate plus two Docker builds.
      - '!v*-*'
      - '!*-*'

permissions:
  contents: read

concurrency:
  group: release-docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-gate:
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml

  # 版本号与构建策略只解析一次，给按平台拆开的 build 矩阵和 merge 共用。
  # 不依赖 quality-gate，与测试并行跑；dispatch 输入不合法时可以立刻失败。
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      platforms: ${{ steps.policy.outputs.platforms }}
      platform_matrix: ${{ steps.policy.outputs.platform_matrix }}
      push: ${{ steps.policy.outputs.push }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve release version
        id: release
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 .github/scripts/resolve_release_version.py \
              --tag "$MANUAL_VERSION" \
              --allow-label \
              --github-output "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            python3 .github/scripts/resolve_release_version.py \
              --tag "$GITHUB_REF_NAME" \
              --github-output "$GITHUB_OUTPUT"
          else
            python3 .github/scripts/resolve_release_version.py \
              --tag "ci-${GITHUB_SHA:0:12}" \
              --allow-label \
              --github-output "$GITHUB_OUTPUT"
          fi

      - name: Resolve build policy
        id: policy
        shell: bash
        env:
          MANUAL_PLATFORMS: ${{ inputs.platforms }}
          MANUAL_PUSH: ${{ inputs.push }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "$MANUAL_PLATFORMS" in
              linux/amd64|linux/arm64|linux/amd64,linux/arm64|linux/arm64,linux/amd64) ;;
              *)
                echo "Unsupported Docker platforms: $MANUAL_PLATFORMS" >&2
                exit 1
                ;;
            esac
            platforms="$MANUAL_PLATFORMS"
            push="$MANUAL_PUSH"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            platforms="linux/amd64,linux/arm64"
            push="true"
          else
            platforms="linux/amd64"
            push="false"
          fi
          platform_matrix="$(jq -cn --arg platforms "$platforms" '$platforms | split(",")')"
          {
            echo "platforms=$platforms"
            echo "push=$push"
            echo "platform_matrix=$platform_matrix"
          } >> "$GITHUB_OUTPUT"
          echo "platforms=$platforms push=$push matrix=$platform_matrix"

  # 每个镜像 × 每个平台一个 job，各自在对应架构的原生 runner 上构建（不再用 QEMU
  # 模拟 arm64：v4.2.6 里 arm64 cargo build 在 QEMU 下要 58.7 分钟）。推送时按
  # digest 推送、不打 tag，由 merge job 合成多架构 manifest list。
  build:
    needs: [quality-gate, prepare]
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: app
            repo: retainpdf-app
          - name: web
            repo: retainpdf-web
        platform: ${{ fromJSON(needs.prepare.outputs.platform_matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve platform slug
        id: platform
        shell: bash
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          # artifact 名 / cache scope 里不能带 `/`：linux/amd64 -> amd64。
          case "$TARGET_PLATFORM" in
            linux/amd64|linux/arm64) ;;
            *)
              echo "Unsupported Docker platform: $TARGET_PLATFORM" >&2
              exit 1
              ;;
          esac
          echo "slug=${TARGET_PLATFORM#linux/}" >> "$GITHUB_OUTPUT"
          echo "runner arch: $(uname -m)"

      - name: Prepare embedded backend package
        if: matrix.target.name == 'app'
        id: backend
        uses: ./.github/actions/prepare-backend-source

      - name: Resolve image build source
        id: build-source
        shell: bash
        run: |
          if [ "${{ matrix.target.name }}" = "app" ]; then
            echo "context=${{ steps.backend.outputs.source_root }}" >> "$GITHUB_OUTPUT"
            echo "file=${{ steps.backend.outputs.source_root }}/ops/deployment/docker/backend/Dockerfile.app" >> "$GITHUB_OUTPUT"
          else
            echo "context=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
            echo "file=$GITHUB_WORKSPACE/ops/deployment/docker/Dockerfile.web" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve Docker Hub namespace
        id: hub
        run: |
          user="${{ secrets.DOCKERHUB_USERNAME }}"
          if [ -z "$user" ]; then
            user="${GITHUB_REPOSITORY_OWNER}"
          fi
          echo "user=${user}" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.hub.outputs.user }}/${{ matrix.target.repo }}
          tags: |
            type=raw,value=candidate-${{ github.sha }}-${{ github.run_id }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}

      - name: Login to Docker Hub
        if: needs.prepare.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate build args
        id: build-args
        run: |
          {
            for var in http_proxy https_proxy HTTP_PROXY HTTPS_PROXY ALL_PROXY TYPST_VERSION; do
              val="$(printenv "$var" || true)"
              if [ -n "$val" ]; then
                echo "${var}=${val}"
              fi
            done
            echo "RETAIN_PDF_VERSION=${{ needs.prepare.outputs.version }}"
          } > /tmp/build-args.txt
          {
            echo 'args<<EOF'
            cat /tmp/build-args.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Resolve image output
        id: image-output
        shell: bash
        env:
          PUSH_IMAGE: ${{ needs.prepare.outputs.push }}
          IMAGE_NAME: ${{ steps.hub.outputs.user }}/${{ matrix.target.repo }}
          META_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          if [ "$PUSH_IMAGE" = "true" ]; then
            # 只按 digest 推送单平台镜像、不打 tag；candidate tag 由 merge job
            # 打在合成后的多架构 manifest list 上。
            echo "outputs=type=image,name=${IMAGE_NAME},push-by-digest=true,name-canonical=true,push=true" >> "$GITHUB_OUTPUT"
            echo "tags=" >> "$GITHUB_OUTPUT"
          else
            # 不推送：PR 构建 load 进本地 daemon 做冒烟；dispatch push=false 只验证能构建。
            echo "outputs=" >> "$GITHUB_OUTPUT"
            {
              echo 'tags<<EOF'
              printf '%s\n' "$META_TAGS"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      # 构建缓存放在 Docker Hub（registry 缓存），不再用 gha：
      # - gha 缓存按 ref 隔离，tag run 写的下一个 tag 读不到（只能读 main 的，而 main
      #   push 并不触发这个 workflow），v4.2.6 一个 tag 白写了 3.8GB、挤掉 main 的
      #   缓存还多花约 6 分钟导出；
      # - registry 缓存谁都能读：上一个 tag 写的，下一个 tag、PR、dispatch 都能命中，
      #   而且按内容寻址，没变的层（Rust 依赖层）不会重复上传。
      # 只有会推送镜像（已登录 Docker Hub）的路径写缓存；PR / push=false 的 dispatch
      # 匿名只读。ignore-error：缓存导出失败不该让发版失败。
      # 每个平台一个 ref，amd64 / arm64 并行写互不覆盖。
      - name: Resolve build cache
        id: cache
        shell: bash
        env:
          PUSH_IMAGE: ${{ needs.prepare.outputs.push }}
          CACHE_REF: ${{ steps.hub.outputs.user }}/${{ matrix.target.repo }}:buildcache-${{ steps.platform.outputs.slug }}
        run: |
          echo "from=type=registry,ref=${CACHE_REF}" >> "$GITHUB_OUTPUT"
          if [ "$PUSH_IMAGE" = "true" ]; then
            echo "to=type=registry,ref=${CACHE_REF},mode=max,ignore-error=true" >> "$GITHUB_OUTPUT"
          else
            echo "to=" >> "$GITHUB_OUTPUT"
          fi
          echo "cache ref: ${CACHE_REF} (write: ${PUSH_IMAGE})"

      - name: Build and push
        id: build-image
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.build-source.outputs.context }}
          file: ${{ steps.build-source.outputs.file }}
          platforms: ${{ matrix.platform }}
          # 推送走上面的 outputs（push-by-digest），不再用 push 开关。
          push: false
          outputs: ${{ steps.image-output.outputs.outputs }}
          # Every matrix job is a native single-platform build, so loading PR
          # images into the local daemon for the smoke test is safe.
          load: ${{ github.event_name == 'pull_request' }}
          build-args: ${{ steps.build-args.outputs.args }}
          tags: ${{ steps.image-output.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ steps.cache.outputs.from }}
          cache-to: ${{ steps.cache.outputs.to }}

      - name: Export platform image digest
        if: needs.prepare.outputs.push == 'true'
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build-image.outputs.digest }}
        run: |
          if ! printf '%s' "$IMAGE_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "Build did not return a valid image digest: $IMAGE_DIGEST" >&2
            exit 1
          fi
          mkdir -p docker-digests
          touch "docker-digests/${IMAGE_DIGEST#sha256:}"
          ls docker-digests

      - name: Upload platform image digest
        if: needs.prepare.outputs.push == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: docker-digest-${{ matrix.target.name }}-${{ steps.platform.outputs.slug }}-${{ github.run_id }}
          path: docker-digests/*
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Smoke loaded PR image
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          IMAGE_REF: ${{ steps.hub.outputs.user }}/${{ matrix.target.repo }}:candidate-${{ github.sha }}-${{ github.run_id }}
          TARGET_NAME: ${{ matrix.target.name }}
        run: |
          container="retainpdf-${TARGET_NAME}-pr-smoke"
          cleanup() {
            rc=$?
            trap - EXIT
            if [ "$rc" -ne 0 ]; then
              docker logs "$container" 2>&1 || true
            fi
            docker rm -f "$container" >/dev/null 2>&1 || true
            exit "$rc"
          }
          trap cleanup EXIT

          docker image inspect "$IMAGE_REF" >/dev/null
          if [ "$TARGET_NAME" = "web" ]; then
            docker run -d \
              --name "$container" \
              --add-host app:127.0.0.1 \
              -p 18080:80 \
              "$IMAGE_REF"
            probe_url="http://127.0.0.1:18080/"
          else
            docker run -d \
              --name "$container" \
              -e RUST_API_AI_SUPERVISE=0 \
              -e RUST_API_KEYS=retainpdf-ci-smoke-key \
              -p 14100:41000 \
              "$IMAGE_REF"
            probe_url="http://127.0.0.1:14100/health"
          fi

          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error "$probe_url" >/dev/null; then
              echo "${TARGET_NAME} image smoke passed on attempt ${attempt}"
              exit 0
            fi
            sleep 2
          done
          echo "${TARGET_NAME} image did not become ready at ${probe_url}" >&2
          exit 1

  # 把同一镜像各平台按 digest 推送的结果合成一个多架构 manifest list、打上
  # candidate tag，再写出与拆分前结构相同的 candidate identity JSON（digest 是
  # 合成后的 manifest list），publish 的校验与推广逻辑不变。
  merge:
    needs: [prepare, build]
    if: needs.prepare.outputs.push == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: app
            repo: retainpdf-app
          - name: web
            repo: retainpdf-web

    steps:
      - name: Download platform image digests
        uses: actions/download-artifact@v7
        with:
          pattern: docker-digest-${{ matrix.target.name }}-*-${{ github.run_id }}
          path: docker-digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve Docker Hub namespace
        id: hub
        shell: bash
        run: |
          user="${{ secrets.DOCKERHUB_USERNAME }}"
          if [ -z "$user" ]; then
            user="${GITHUB_REPOSITORY_OWNER}"
          fi
          echo "user=${user}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create multi-platform candidate manifest
        id: manifest
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.hub.outputs.user }}/${{ matrix.target.repo }}
          CANDIDATE_TAG: candidate-${{ github.sha }}-${{ github.run_id }}
          TARGET_PLATFORMS: ${{ needs.prepare.outputs.platforms }}
        run: |
          expected_count="$(printf '%s\n' "$TARGET_PLATFORMS" | tr ',' '\n' | grep -c .)"
          mapfile -t digests < <(find docker-digests -maxdepth 1 -type f -printf '%f\n' | sort)
          if [ "${#digests[@]}" -ne "$expected_count" ]; then
            echo "Expected ${expected_count} platform digests for ${IMAGE_NAME}, got ${#digests[@]}: ${digests[*]}" >&2
            exit 1
          fi
          sources=()
          for digest in "${digests[@]}"; do
            if ! printf '%s' "$digest" | grep -Eq '^[0-9a-f]{64}$'; then
              echo "Invalid platform digest file: $digest" >&2
              exit 1
            fi
            sources+=("${IMAGE_NAME}@sha256:${digest}")
          done
          docker buildx imagetools create --tag "${IMAGE_NAME}:${CANDIDATE_TAG}" "${sources[@]}"
          docker buildx imagetools inspect "${IMAGE_NAME}:${CANDIDATE_TAG}"
          merged_digest="$(docker buildx imagetools inspect "${IMAGE_NAME}:${CANDIDATE_TAG}" --format '{{json .Manifest}}' | jq -r '.digest')"
          echo "digest=${merged_digest}" >> "$GITHUB_OUTPUT"

      - name: Record candidate image identity
        shell: bash
        env:
          TARGET_NAME: ${{ matrix.target.name }}
          TARGET_REPO: ${{ matrix.target.repo }}
          IMAGE_DIGEST: ${{ steps.manifest.outputs.digest }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          TARGET_PLATFORMS: ${{ needs.prepare.outputs.platforms }}
        run: |
          if ! printf '%s' "$IMAGE_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "Merged manifest did not return a valid image digest: $IMAGE_DIGEST" >&2
            exit 1
          fi
          mkdir -p docker-candidate
          jq -n \
            --arg target "$TARGET_NAME" \
            --arg repo "$TARGET_REPO" \
            --arg digest "$IMAGE_DIGEST" \
            --arg revision "$GITHUB_SHA" \
            --arg version "$RELEASE_VERSION" \
            --arg platforms "$TARGET_PLATFORMS" \
            '{target: $target, repo: $repo, digest: $digest, revision: $revision, version: $version, platforms: $platforms}' \
            > "docker-candidate/${TARGET_NAME}.json"
          cat "docker-candidate/${TARGET_NAME}.json"

      - name: Upload candidate image identity
        uses: actions/upload-artifact@v7
        with:
          name: docker-candidate-${{ matrix.target.name }}-${{ github.run_id }}
          path: docker-candidate/${{ matrix.target.name }}.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish:
    needs: merge
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.push == true)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout release revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release version
        id: release
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 .github/scripts/resolve_release_version.py \
              --tag "$MANUAL_VERSION" \
              --allow-label \
              --github-output "$GITHUB_OUTPUT"
          else
            python3 .github/scripts/resolve_release_version.py \
              --tag "$GITHUB_REF_NAME" \
              --github-output "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Download app candidate identity
        uses: actions/download-artifact@v7
        with:
          name: docker-candidate-app-${{ github.run_id }}
          path: docker-candidates

      - name: Download web candidate identity
        uses: actions/download-artifact@v7
        with:
          name: docker-candidate-web-${{ github.run_id }}
          path: docker-candidates

      - name: Resolve Docker Hub namespace
        id: hub
        shell: bash
        run: |
          user="${{ secrets.DOCKERHUB_USERNAME }}"
          if [ -z "$user" ]; then
            user="${GITHUB_REPOSITORY_OWNER}"
          fi
          echo "user=${user}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify both candidate images
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          for target in app web; do
            manifest="docker-candidates/${target}.json"
            if [ ! -s "$manifest" ]; then
              echo "Missing candidate identity manifest: $manifest" >&2
              exit 1
            fi
            revision="$(jq -r '.revision' "$manifest")"
            version="$(jq -r '.version' "$manifest")"
            manifest_target="$(jq -r '.target' "$manifest")"
            repo="$(jq -r '.repo' "$manifest")"
            digest="$(jq -r '.digest' "$manifest")"
            platforms="$(jq -r '.platforms' "$manifest")"
            if [ "$manifest_target" != "$target" ] || [ "$revision" != "$GITHUB_SHA" ] || [ "$version" != "$EXPECTED_VERSION" ]; then
              echo "Candidate identity mismatch for $target: revision=$revision version=$version" >&2
              exit 1
            fi
            if ! printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
              echo "Invalid candidate digest for $target: $digest" >&2
              exit 1
            fi
            case "$target:$repo" in
              app:retainpdf-app|web:retainpdf-web) ;;
              *)
                echo "Unexpected candidate repository for $target: $repo" >&2
                exit 1
                ;;
            esac
            image="${{ steps.hub.outputs.user }}/${repo}@${digest}"
            echo "Verifying ${image} for ${platforms}"
            docker buildx imagetools inspect "$image" --format '{{json .Image}}' > "docker-candidates/${target}-images.json"
            expected_platforms="$(printf '%s' "$platforms" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sort)"
            actual_platforms="$(jq -r 'keys[]' "docker-candidates/${target}-images.json" | sort)"
            if [ "$actual_platforms" != "$expected_platforms" ]; then
              echo "Candidate platform mismatch for $target" >&2
              echo "expected: $expected_platforms" >&2
              echo "actual: $actual_platforms" >&2
              exit 1
            fi
            label_mismatches="$(
              jq \
                --arg revision "$GITHUB_SHA" \
                --arg version "$EXPECTED_VERSION" \
                '[to_entries[] | select(
                  .value.config.Labels["org.opencontainers.image.revision"] != $revision or
                  .value.config.Labels["org.opencontainers.image.version"] != $version
                )] | length' \
                "docker-candidates/${target}-images.json"
            )"
            if [ "$label_mismatches" != "0" ]; then
              echo "Candidate OCI identity labels do not match this release for $target" >&2
              exit 1
            fi
          done

      - name: Verify release identity before promotion
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          head_sha="$(git rev-parse HEAD)"
          if [ "$head_sha" != "$GITHUB_SHA" ]; then
            echo "Checked out revision does not match this run: head=$head_sha expected=$GITHUB_SHA" >&2
            exit 1
          fi

          if [ "${{ github.ref_type }}" = "tag" ]; then
            remote_sha="$(git ls-remote origin "refs/tags/${GITHUB_REF_NAME}^{}" | awk 'NR == 1 { print $1 }')"
            if [ -z "$remote_sha" ]; then
              remote_sha="$(git ls-remote origin "refs/tags/${GITHUB_REF_NAME}" | awk 'NR == 1 { print $1 }')"
            fi
            if [ "$remote_sha" != "$GITHUB_SHA" ]; then
              echo "Release tag moved while Docker images were building: remote=$remote_sha expected=$GITHUB_SHA" >&2
              exit 1
            fi
          else
            case "$RELEASE_TAG" in
              dev|dev-*|manual-*) ;;
              *)
                echo "Manual Docker publishing only accepts dev, dev-*, or manual-* labels" >&2
                exit 1
                ;;
            esac
          fi

      - name: Promote complete Docker release
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          STABLE_RELEASE: ${{ steps.release.outputs.stable }}
        run: |
          for target in app web; do
            repo="$(jq -r '.repo' "docker-candidates/${target}.json")"
            digest="$(jq -r '.digest' "docker-candidates/${target}.json")"
            image="${{ steps.hub.outputs.user }}/${repo}"
            docker buildx imagetools create --tag "${image}:${RELEASE_TAG}" "${image}@${digest}"
            docker buildx imagetools inspect "${image}:${RELEASE_TAG}"
          done

          if [ "$STABLE_RELEASE" = "true" ]; then
            for target in app web; do
              repo="$(jq -r '.repo' "docker-candidates/${target}.json")"
              digest="$(jq -r '.digest' "docker-candidates/${target}.json")"
              image="${{ steps.hub.outputs.user }}/${repo}"
              docker buildx imagetools create --tag "${image}:latest" "${image}@${digest}"
              docker buildx imagetools inspect "${image}:latest"
            done
          fi
