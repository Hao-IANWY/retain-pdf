name: Release Desktop
run-name: Release Desktop · ${{ github.ref_name }}

# 打 tag 发布桌面端。两条路径，由 resolve job 决定：
#
# promote（默认期望）：push main 时 prebuild-release-candidates.yml 已经用同一个
#   commit、同一个版本号构建好三平台安装包。resolve 确认「tag 版本 == commit 声明
#   版本、commit 在 main 上、该 sha 的 Tests 成功、预构建成功、artifact 未过期、
#   manifest 身份一致」后，promote-desktop-release 跨 run 下载这些安装包、逐个
#   比对 sha256，直接创建 GitHub Release，不再重新构建。
#
# build（回退）：上述任一条件不满足（hotfix tag 没对齐版本号、预构建失败 / 过期 /
#   被跳过、commit 不在 main 上……）时，走原来的完整路径：quality-gate 与三平台
#   build 并行，publish-desktop-release 等全部成功后才发布。回退原因写在 resolve
#   的日志、notice 和 run summary 里。
#
# 两条路径用同一个 build-desktop-packages.yml 构建、同一个 publish-desktop-release
# composite action 校验并发布，不会出现两份配置漂移。

"on":
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 决定提升还是回退。只读：actions: read 用于查 workflow run 和下载 artifact。
  # 等 main 上的 Tests / 预构建跑完时最多等 120 分钟（脚本内超时短于
  # timeout-minutes，超时回退到完整构建，而不是让 job 失败）。
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 135
    permissions:
      actions: read
      contents: read
    outputs:
      mode: ${{ steps.decision.outputs.mode }}
      run_id: ${{ steps.decision.outputs.run_id }}
      version: ${{ steps.find.outputs.version }}
      tag: ${{ steps.find.outputs.tag }}
      prerelease: ${{ steps.find.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve declared application version
        id: declared
        shell: bash
        run: |
          if ! python3 .github/scripts/resolve_declared_version.py --github-output "$GITHUB_OUTPUT"; then
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "::warning::This commit does not declare one aligned application version; prebuilt candidates cannot be promoted"
          fi

      - name: Find promotable prebuild
        id: find
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DECLARED_VERSION: ${{ steps.declared.outputs.version }}
        run: |
          python3 .github/scripts/find_release_candidate.py \
            --kind desktop \
            --tag "$GITHUB_REF_NAME" \
            --declared-version "$DECLARED_VERSION"

      - name: Download candidate package manifests
        id: download
        if: steps.find.outputs.mode == 'promote'
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: desktop-meta-*-${{ github.sha }}
          path: candidate-meta
          merge-multiple: true
          run-id: ${{ steps.find.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify candidate package manifests
        id: verify
        if: steps.find.outputs.mode == 'promote' && steps.download.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.find.outputs.version }}
        run: |
          python3 .github/scripts/release_candidate_manifest.py verify-desktop \
            --dir candidate-meta \
            --version "$RELEASE_VERSION" \
            --revision "$GITHUB_SHA"

      - name: Decide release path
        id: decision
        shell: bash
        env:
          FIND_MODE: ${{ steps.find.outputs.mode }}
          FIND_REASON: ${{ steps.find.outputs.reason }}
          CANDIDATE_RUN_ID: ${{ steps.find.outputs.run_id }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          mode="build"
          run_id=""
          reason="$FIND_REASON"
          if [ "$FIND_MODE" = "promote" ]; then
            if [ "$DOWNLOAD_OUTCOME" = "success" ] && [ "$VERIFY_OUTCOME" = "success" ]; then
              mode="promote"
              run_id="$CANDIDATE_RUN_ID"
            else
              reason="prebuild run ${CANDIDATE_RUN_ID} passed lookup but its package manifests could not be downloaded or verified (download=${DOWNLOAD_OUTCOME} verify=${VERIFY_OUTCOME})"
            fi
          fi
          {
            echo "mode=$mode"
            echo "run_id=$run_id"
          } >> "$GITHUB_OUTPUT"
          if [ "$mode" = "promote" ]; then
            echo "::notice title=Desktop release promotes prebuilt packages::$reason"
          else
            echo "::notice title=Desktop release falls back to a full build::$reason"
          fi
          printf -- '- 最终路径：**%s**（%s）\n' "$mode" "$reason" >> "$GITHUB_STEP_SUMMARY"

  # ---------------- 回退路径：完整构建 ----------------

  quality-gate:
    needs: resolve
    if: needs.resolve.outputs.mode == 'build'
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml

  # 三个平台的 build 不等 quality-gate，与测试并行跑（build 只产出 workflow 内
  # artifact，不碰任何 secret、不对外发布）。
  build:
    needs: resolve
    if: needs.resolve.outputs.mode == 'build'
    permissions:
      contents: read
    uses: ./.github/workflows/build-desktop-packages.yml
    with:
      version: ${{ needs.resolve.outputs.version }}

  # 门禁收在这里：必须同时等到 quality-gate 和 build 都成功，测试失败时绝不发布。
  # job 级 if 只比较 mode，不含 always() / failure() 之类的状态函数，GitHub 会
  # 隐式加上 success()，所以任何 needs 失败或被跳过都不会发布。
  publish-desktop-release:
    needs:
      - resolve
      - quality-gate
      - build
    if: needs.resolve.outputs.mode == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 只下载本 run 的 artifact（不需要 actions: read），contents: write 用于创建 Release。
    permissions:
      contents: write

    steps:
      - name: Checkout release revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download desktop packages built by this run
        uses: actions/download-artifact@v7
        with:
          pattern: desktop-*-${{ github.sha }}
          path: release-assets
          merge-multiple: true

      - name: Publish desktop release
        uses: ./.github/actions/publish-desktop-release
        with:
          assets-dir: release-assets
          version: ${{ needs.resolve.outputs.version }}
          tag: ${{ needs.resolve.outputs.tag }}
          prerelease: ${{ needs.resolve.outputs.prerelease }}
          revision: ${{ github.sha }}

  # ---------------- 提升路径：发布 main 上预构建的安装包 ----------------

  # 只在 tag push 且 resolve 判定可提升时运行（PR / dispatch 永远走不到这里）。
  # 跨 run 下载需要 run-id + github-token（actions: read）；安装包 sha256 与
  # manifest 不符时硬失败，不会发布。
  promote-desktop-release:
    needs: resolve
    if: github.event_name == 'push' && github.ref_type == 'tag' && needs.resolve.outputs.mode == 'promote'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout release revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download prebuilt desktop packages
        uses: actions/download-artifact@v7
        with:
          pattern: desktop-*-${{ github.sha }}
          path: release-assets
          merge-multiple: true
          run-id: ${{ needs.resolve.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Publish desktop release
        uses: ./.github/actions/publish-desktop-release
        with:
          assets-dir: release-assets
          version: ${{ needs.resolve.outputs.version }}
          tag: ${{ needs.resolve.outputs.tag }}
          prerelease: ${{ needs.resolve.outputs.prerelease }}
          revision: ${{ github.sha }}
